# Publish @junaed93/nightshift to npm using trusted publishing (OIDC).
#
# No NPM_TOKEN secret is involved. npm verifies this workflow's identity through
# GitHub's OIDC provider and issues a short-lived, single-use credential, so
# there is no long-lived write token to leak or rotate. This is also the only
# way to get a provenance attestation, which is what links the npm package page
# back to this repository and commit.
#
# One-time setup on npmjs.com, required before this workflow can succeed:
#
#   1. Publish the package manually once, so it exists on the registry.
#      A trusted publisher can only be configured for an existing package.
#   2. Open the package settings -> Trusted Publisher -> GitHub Actions, and fill in:
#        Organization or user : Junaed93
#        Repository           : NightShift
#        Workflow filename    : publish.yml
#        Environment name     : (leave blank)
#        Allowed actions      : allow "npm publish"
#   3. npm requires the first successful publish within 2 days of creating the
#      configuration, otherwise it expires.
#
# Release flow after that:
#   npm version patch && git push --follow-tags
#
# The tag push starts this workflow, which publishes and signs the package.

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required: lets the job mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # The package has no runtime dependencies, but a lockfile may appear later.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Test
        run: npm test

      # No token: npm detects the OIDC environment and exchanges it for a
      # short-lived publish credential. Provenance is generated automatically.
      - name: Publish
        run: npm publish
